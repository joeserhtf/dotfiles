# Sensor da tampa (Avell A60 MUV) dispara "Lid closed" falso e suspende o PC.
# Ignora a tampa; suspender manualmente com `systemctl suspend`.
#
# Instalar (copiar, não stow: logind roda com ProtectHome=yes e não segue symlink p/ /home):
#   sudo install -Dm644 ~/dotfiles/logind/etc/systemd/logind.conf.d/lid.conf /etc/systemd/logind.conf.d/lid.conf
#   sudo systemctl kill -s HUP systemd-logind
[Login]
HandleLidSwitch=ignore
HandleLidSwitchExternalPower=ignore
